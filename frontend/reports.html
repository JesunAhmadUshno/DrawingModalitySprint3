<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Reports - PulseKey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --success: #4CAF50;
            --warning: #FF9800;
            --danger: #f5576c;
            --border: #2a2a4a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-tertiary: #888888;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== HEADER ===== */
        .header-sticky {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, var(--bg-primary) 0%, rgba(26, 26, 46, 0.95) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            transition: all 0.3s ease;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .nav-button {
            background: linear-gradient(135deg, #2a2a4a 0%, #1f1f3a 100%);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .nav-button:hover {
            background: linear-gradient(135deg, #3a3a5a 0%, #2f2f4a 100%);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .stat-badge {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* ===== FILTER SECTION ===== */
        .filter-section {
            background: rgba(26, 26, 46, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
        }

        .filter-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #2a2a4a 0%, #1f1f3a 100%);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
            margin-bottom: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .search-input::placeholder {
            color: var(--text-tertiary);
        }

        .controls-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .control-select {
            padding: 12px 14px;
            background: linear-gradient(135deg, #2a2a4a 0%, #1f1f3a 100%);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-select:hover {
            border-color: var(--accent-primary);
        }

        .control-select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* ===== SESSIONS GRID ===== */
        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .session-card {
            background: linear-gradient(135deg, #2a2a4a 0%, #1f1f3a 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .session-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .session-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.2);
        }

        .session-card:hover::before {
            opacity: 1;
        }

        .session-id {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-primary);
            word-break: break-all;
            margin-bottom: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .session-datetime {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        /* ===== SCORE SECTION ===== */
        .score-section {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 12px;
        }

        .score-main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8px;
        }

        .score-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .score-grade {
            font-size: 56px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            margin-bottom: 6px;
        }

        .score-grade.grade-a {
            color: #4CAF50;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
        }

        .score-grade.grade-b {
            color: #8BC34A;
            text-shadow: 0 0 20px rgba(139, 195, 74, 0.4);
        }

        .score-grade.grade-c {
            color: #FFB74D;
            text-shadow: 0 0 20px rgba(255, 183, 77, 0.4);
        }

        .score-grade.grade-d {
            color: #FF9800;
            text-shadow: 0 0 20px rgba(255, 152, 0, 0.4);
        }

        .score-grade.grade-f {
            color: #f5576c;
            text-shadow: 0 0 20px rgba(245, 87, 108, 0.4);
        }

        .score-numeric {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .score-components {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        .component-bar {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .component-header {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .component-bar-bg {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            height: 7px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .component-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bar-efficiency {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .bar-quality {
            background: linear-gradient(90deg, #21c7a8 0%, #5dff6c 100%);
        }

        /* ===== SESSION META ===== */
        .session-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
        }

        .meta-pill.ok {
            border-color: rgba(76, 175, 80, 0.3);
            color: #7ec889;
        }

        .meta-pill.warn {
            border-color: rgba(255, 183, 77, 0.3);
            color: #ffd08a;
        }

        .meta-pill.bad {
            border-color: rgba(245, 87, 108, 0.3);
            color: #ff8fa3;
        }

        /* ===== SESSION DETAILS ===== */
        .session-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .detail-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .detail-label {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* ===== SESSION ACTIONS ===== */
        .session-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .action-button {
            padding: 10px 12px;
            background: linear-gradient(135deg, #2a2a4a 0%, #1f1f3a 100%);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .action-button:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            background: linear-gradient(135deg, #3a3a5a 0%, #2f2f4a 100%);
            transform: translateY(-2px);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.6;
        }

        .empty-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .empty-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .empty-button {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .empty-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        /* ===== LOADING STATE ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            display: inline-block;
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border-radius: 12px;
            padding: 30px;
            max-width: 1350px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid var(--border);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            color: var(--accent-primary);
            transform: rotate(90deg);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== MODAL TABS ===== */
        .modal-tabs {
            display: flex;
            gap: 12px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .modal-tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .modal-tab-btn:hover {
            color: var(--accent-primary);
        }

        .modal-tab-btn.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }

        .modal-content-wrapper {
            position: relative;
        }

        .modal-tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .modal-tab-content.active {
            display: block;
        }

        /* ===== CHART GRID ===== */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-box {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        .chart-box:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
        }

        .chart-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== DASHBOARD CARDS ===== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .dashboard-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            transition: all 0.2s ease;
        }

        .dashboard-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .dashboard-card .k {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .dashboard-card .v {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
        }

        /* ===== SECTIONS ===== */
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 24px 0 14px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            position: relative;
        }

        .section-title::before {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            height: 2px;
            width: 60px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        /* ===== CHARTS ===== */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .chart-box {
            background: linear-gradient(135deg, #2a2a4a 0%, #1f1f3a 100%);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }

        .chart-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .chart-box canvas {
            max-height: 280px;
        }

        /* ===== TABLES ===== */
        .tables-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) {
            .tables-grid {
                grid-template-columns: 1fr;
            }
        }

        .metric-table-wrap {
            background: linear-gradient(135deg, #2a2a4a 0%, #1f1f3a 100%);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .metric-table-title {
            background: linear-gradient(135deg, #3a3a5a 0%, #2f2f4a 100%);
            color: var(--text-primary);
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }

        .metric-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .metric-table td {
            border-top: 1px solid var(--border);
            padding: 8px 10px;
            vertical-align: top;
        }

        .metric-table td:first-child {
            color: var(--text-tertiary);
            width: 55%;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 11px;
        }

        .metric-table td:last-child {
            color: var(--text-secondary);
            font-weight: 600;
            word-break: break-word;
        }

        /* ===== DOWNLOAD BUTTON ===== */
        .download-button {
            margin-top: 20px;
            background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s ease;
        }

        .download-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(76, 175, 80, 0.3);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sessions-grid {
                grid-template-columns: 1fr;
            }

            .controls-row {
                grid-template-columns: 1fr;
            }

            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .header-left,
            .header-right {
                width: 100%;
            }

            .page-title {
                font-size: 24px;
            }

            .session-details,
            .session-meta,
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
                max-width: 95%;
            }

            .score-section {
                grid-template-columns: 1fr;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="header-sticky">
        <div class="container">
            <div class="header-content">
                <div class="header-left">
                    <button class="nav-button" onclick="window.history.back()" title="Go Back">←</button>
                    <button class="nav-button" onclick="window.location.href='index.html'" title="Home">🏠</button>
                    <h1 class="page-title">Assessment Reports</h1>
                </div>
                <div class="header-right">

    <div class="modal" id="reportModal">
